# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cvoptimizer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# OCR
# ===============================
# Leave blank to auto-detect by OS (Windows/Mac/Linux default paths).
# Override if Tesseract is installed somewhere non-standard.
ocr.tessdata-path=${OCR_TESSDATA_PATH:}

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ===============================
# INTERVIEW SESSION
# ===============================
interview.session.ttl-ms=3600000
interview.session.cleanup-interval-ms=300000

# ===============================
# RAG
# ===============================
# Keys are flat (rag.search-default-limit, not rag.search.default-limit) to bind to RagProperties fields.
rag.embedding-dimension=1536
rag.search-default-limit=5
rag.search-min-similarity=0.30
# Index resources/knowledge/*.md into pgvector on startup (only new or changed notes are embedded)
rag.bootstrap-enabled=true

# ===============================
# AI EVALUATION
# ===============================
# ===============================
# CORS
# ===============================
# Comma-separated list of origins allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===============================
# AI EVALUATION
# ===============================
ai.evaluation.enabled=true
ai.evaluation.api-key=${OPENAI_API_KEY:}
ai.evaluation.model=gpt-4o
ai.evaluation.base-url=https://api.openai.com/v1
ai.evaluation.max-context-items=3
ai.evaluation.max-output-tokens=500
ai.evaluation.reasoning-effort=low